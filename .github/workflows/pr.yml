name: Plugin checks

# Two jobs on every pull request, for forks too, neither with a write token
# (H5). Comments and labels come from a third, separate workflow
# (pr-report.yml, on workflow_run), which runs only the default branch's
# code and reads only the `check` job's artifact, validated.
#
# `check` runs the BASE commit's scripts (checked out into base/) on the
# pull request's tree (pr/), as data: nothing from the pull request runs, not
# its tests, not its server, not its copy of scripts/, schema/ or
# OCTIPUS_REF. The Octipus CLI is the one at the base's OCTIPUS_REF.
#
# `test` runs the plugins' own tests and a smoke run of their servers in a
# bwrap sandbox without network (base/scripts/test-plugins.mjs). It only
# passes or fails: it uploads nothing, and nothing it prints reaches the
# report.
#
# A pull request can change this file; what it then runs is still read-only,
# and the report labels any change outside plugins/<name>/ (this file
# included) needs-maintainer-review. Code owners' review (CODEOWNERS) is what
# protects main from such a change.

on:
  pull_request:

concurrency:
  group: plugin-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Check changed plugins (data only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the base commit's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out the pull request's tree (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Read the base's OCTIPUS_REF
        id: ref
        working-directory: base
        run: |
          ref="$(grep -v '^[[:space:]]*#' OCTIPUS_REF | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]')"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::OCTIPUS_REF must be a full 40-hex commit id"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Octipus CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PatriceA/octipus
          ref: ${{ steps.ref.outputs.ref }}
          path: octipus
          persist-credentials: false

      # The same Node as the publishing machine (.node-version): the tarball's
      # deflate stream comes from Node's bundled zlib.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: base/.node-version

      - name: Install dependencies (no lifecycle scripts)
        run: |
          npm ci --ignore-scripts --prefix base
          npm ci --ignore-scripts --prefix octipus

      - name: Check
        id: check
        env:
          OCTIPUS: ${{ github.workspace }}/octipus
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          node base/scripts/check.mjs --repo pr --base "$BASE_SHA" --head "$HEAD_SHA" --result check-result.json --summary check-summary.md > /dev/null
          code=$?
          set -e
          if [ -f check-summary.md ]; then cat check-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: check-result
          path: check-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail on problems
        if: steps.check.outputs.code != '0'
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: |
          echo "::error::The plugin checks failed (exit $CODE): see the summary."
          exit 1

  test:
    name: Plugin tests (sandboxed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the base commit's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out the pull request's tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: base/.node-version

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --prefix base

      # As Octipus's own sandbox job: Ubuntu 24.04 restricts unprivileged
      # user namespaces through AppArmor, which a throwaway CI VM may lift.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version

      - name: Test in the sandbox
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node base/scripts/test-plugins.mjs --repo pr --base "$BASE_SHA" --head "$HEAD_SHA"
