name: Site

# Build plugins.octipus.cc on pull requests that touch it, so a change cannot
# break it: once as the empty marketplace, once with fixture data (the site
# test, which also checks that no page loads an external script).

on:
  pull_request:
    paths:
      - 'site/**'
      - 'schema/**'
      - 'scripts/lib/asks-for.mjs'
      - 'scripts/lib/index-v2.mjs'
      - 'CONTRIBUTING.md'
      - 'docs/REVIEW-CHECKLIST.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (empty marketplace)
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build:site

      - name: Build with fixtures and check the pages
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: node --test tests/site.test.mjs site/src/lib/markdown.test.mjs
